# This workflow tests, builds, and publishes to npm after approval
# Publish step requires environment approval (default: repository admins)
# For more information see: https://docs.github.com/en/actions/deployment/protecting-deployments/about-environments

name: Node.js Package

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish-npm:
    needs: build
    permissions:
      id-token: write
      contents: read
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@praneethtss/bonfire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - name: Publish to npm with OIDC
        run: npm publish --provenance --access public

